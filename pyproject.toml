[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrbot-plugin-tavern"
version = "0.1.2"
description = "SillyTavern-style character roleplay (cards, world info, chats) for AstrBot"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Optional: PNG image cards only need Pillow for the *image* side; the card
# metadata itself is read with the standard library (zlib/struct/base64).
png = ["pillow>=10"]
yaml = ["pyyaml>=6"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# Scratch and generated trees: not part of the plugin, not linted.
exclude = [
  ".tmp-test-data",
  ".tools",
  ".uv-cache",
  ".acl-recovery",
  ".scratch",
  "tools/st-oracle/.build",
  "data",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
