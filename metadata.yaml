# AstrBot 酒馆风格角色扮演插件
#
# 「酒馆」指 SillyTavern（https://github.com/SillyTavern/SillyTavern）。
# 本插件复用了它的角色卡（Character Card V1/V2/V3）、世界书（World Info）
# 与聊天记录（.jsonl）格式语义，但**不包含**其任何代码或资源。
name: astrbot_plugin_tavern
display_name: 酒馆角色扮演
short_desc: 在 QQ/微信里用酒馆的角色卡与世界书聊天
desc: |
  把 SillyTavern（酒馆）的角色卡、世界书与聊天体验带进 AstrBot。

  支持：
  - 导入酒馆角色卡（.json / .png / .yaml，V1 / V2 / V3 规范）
  - 导入酒馆世界书（.json，关键词 / 正则 / 选择性触发、递归、sticky/cooldown、token 预算）
  - 每个群或私聊独立绑定角色卡，多轮上下文由 AstrBot 会话维护
  - 世界书命中内容按轮注入，稳定人设与动态上下文分离，不破坏 prompt 缓存
  - 可选对接已部署的 SillyTavern（读卡片/世界书/聊天，或直接代理生成）

  格式与行为语义参考 SillyTavern（AGPL-3.0），仅借鉴公开的数据格式与交互设计，
  未复制其代码。
version: 0.1.0
author: TARGET_AUTHOR
repo: https://github.com/TARGET_OWNER/astrbot_plugin_tavern
astrbot_version: ">=4.17,<5"
support_platforms:
  - aiocqhttp
  - telegram
  - discord
  - wecom
tags:
  - roleplay
  - tavern
  - character-card
  - worldbook
