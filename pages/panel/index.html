<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>酒馆 · 管理台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">灯</span>
          <div>
            <strong>酒馆角色扮演</strong>
            <span class="brand-sub" id="brand-version">管理台</span>
          </div>
        </div>
        <nav id="nav" class="nav" role="tablist">
          <button role="tab" data-view="overview" aria-selected="true">总览</button>
          <button role="tab" data-view="cards" aria-selected="false">角色卡</button>
          <button role="tab" data-view="books" aria-selected="false">世界书</button>
          <button role="tab" data-view="sessions" aria-selected="false">会话与分支</button>
          <button role="tab" data-view="remote" aria-selected="false">外部酒馆</button>
          <button role="tab" data-view="settings" aria-selected="false">配置</button>
        </nav>
        <div class="sidebar-foot">
          <span id="conn" class="conn">连接中…</span>
        </div>
      </aside>

      <main class="main">
        <div id="toast" class="toast" hidden></div>
        <section class="view" id="view-overview"></section>
        <section class="view" id="view-cards" hidden></section>
        <section class="view" id="view-books" hidden></section>
        <section class="view" id="view-sessions" hidden></section>
        <section class="view" id="view-remote" hidden></section>
        <section class="view" id="view-settings" hidden></section>
      </main>
    </div>

    <!--
      A module script on purpose: modules are deferred, so the bridge SDK that
      AstrBot injects before `</body>` is guaranteed to have run by the time this
      executes. An inline synchronous script would race it.
    -->
    <script type="module" src="./app.js"></script>
  </body>
</html>
